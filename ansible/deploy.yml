---
- name: Deploy AI Career Coach
  hosts: ec2
  become: true

  tasks:
    - name: Ensure Docker is installed
      apt:
        name: [docker.io, awscli]
        state: present
        update_cache: yes

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create persistent directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        mode: '0755'
      loop:
        - /opt/ai-career-coach/uploads
        - /opt/ai-career-coach/vector_index

    - name: Authenticate Docker to ECR
      shell: >
        aws ecr get-login-password --region {{ aws_region }}
        | docker login --username AWS --password-stdin {{ ecr_repo }}

    - name: Pull image from ECR
      shell: "docker pull {{ ecr_repo }}:{{ image_tag }}"

    - name: Stop and remove existing container
      shell: |
        docker stop ai-career-coach 2>/dev/null || true
        docker rm   ai-career-coach 2>/dev/null || true

    - name: Run container
      shell: >
        docker run -d
        --name ai-career-coach
        --restart unless-stopped
        -p 5000:5000
        -e GEMINI_API_KEY="{{ gemini_api_key }}"
        -e SECRET_KEY="{{ secret_key }}"
        -e FLASK_ENV=production
        -v /opt/ai-career-coach/uploads:/app/uploads
        -v /opt/ai-career-coach/vector_index:/app/vector_index
        {{ ecr_repo }}:{{ image_tag }}

    - name: Verify container is running
      shell: docker ps --filter name=ai-career-coach --filter status=running --format '{{ "{{" }}.Names{{ "}}" }}'
      register: container_status

    - name: Fail if container not running
      fail:
        msg: "Container failed to start"
      when: "'ai-career-coach' not in container_status.stdout"
